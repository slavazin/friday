<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Counter</title></head>
<body>
<main>
  <h1>Counter</h1>
  <p id="out">0</p>
  <label for="name">Name</label>
  <input type="text" id="name">
  <button id="go" onclick="go()">Add one</button>
</main>
<script>
function go() {
  const out = document.getElementById("out");
  out.textContent = String(Number(out.textContent) + 1);
}
</script>
<script type="application/json" id="how-to-data">{"summary": "a counter", "controls": []}</script>
</body>
</html>
