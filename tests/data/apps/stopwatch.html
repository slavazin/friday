<!doctype html>
<html><head><meta charset="utf-8"><title>Stopwatch</title></head>
<body>
<p><span id="time">0</span> ticks</p>
<button id="start">Start</button>
<button id="stop">Stop</button>
<button id="reset">Reset</button>
<script>
  let t = 0, timer = null;
  const show = () => { document.getElementById('time').textContent = String(t); };
  document.getElementById('start').onclick = () => { if (!timer) timer = setInterval(() => { t++; show(); }, 40); };
  document.getElementById('stop').onclick = () => { clearInterval(timer); timer = null; };
  document.getElementById('reset').onclick = () => { t = 0; show(); };
</script>
</body></html>
