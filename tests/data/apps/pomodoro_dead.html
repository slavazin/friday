<!doctype html><html><body>
<p>Left: <span id="t">1500</span></p>
<button id="start">Start</button>
<button id="d1">D1</button><button id="d2">D2</button><button id="d3">D3</button><button id="d4">D4</button>
<button id="d5">D5</button><button id="d6">D6</button><button id="d7">D7</button>
<script>
let n = 1500, timer = null;
document.getElementById('start').onclick = () => {
  if (timer) return;
  document.getElementById('start').textContent = 'Running';
  timer = setInterval(() => { document.getElementById('t').textContent = String(--n); }, 1000);
};
</script></body></html>
