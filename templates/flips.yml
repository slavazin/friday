# Status-flip commit templates (SPEC § 2 Rendered text). One template per flip; every figure is rendered
# from the Ledger and run.yml by friday/app/render.py. No hand-written flip commits, no adjectives.
decision:
  gate.admit: "{id} candidate → admitted: W {wealth:.1f} ≥ {threshold:.2f}, n {n} pairs, mean d {mean_d:.2f}, Q change upper bound {q_upper:.1f} ≤ {margin:g}"
  gate.refuse: "{id} candidate → refused: harm W {mirror_wealth:.1f} ≥ {threshold:.2f}, n {n} pairs, mean d {mean_d:.2f}"
  gate.expire: "{id} candidate → expired: n {n} pairs ≥ {n_max}, W {wealth:.1f}, mean d {mean_d:.2f}"
  detect.suspect: "{id} admitted → suspect: {reasons}; window upper bound {window_upper}, harm W {harm_wealth:.1f}, contradicted share {contradicted}"
  detect.clear: "{id} suspect → admitted: {n} confirmation pairs, mean d {mean_d:.2f} ({level_pct:g} % upper bound {upper:.2f})"
  detect.retire: "{id} suspect → retired: {n} confirmation pairs, mean d {mean_d:.2f} ({level_pct:g} % upper bound {upper:.2f}); successor {successor}"
  supersede: "{id} {old} → retired: superseded by {successor}"
  steer.retire: "{id} {old} → retired: steer, \"{reason}\""
  steer.veto: "{id} candidate → refused: steer veto, \"{reason}\""
lens:
  lens.clear_floor: "{id} minted lens clears its floor: AUC {value:.2f} over {n} passes, floor {floor:.2f}"
  lens.floor: "{id} {old} → retired: AUC {value:.2f} below floor {floor:.2f} at {strikes} consecutive closes"
  lens.fold: "{id} {old} → superseded by {superseded_by}: Spearman rho {rho:.2f} > {fold_rho:g}"
  lens.cap: "{id} {old} → retired: lowest value {value:.2f} over the cap of {cap}"
# Pings to the human (SPEC § 11), rendered by the round close from the stores and run.yml.
ping:
  suspect_contradicted: "{id} admitted → suspect while the judge marks it contradicted on {contradicted} of its last {n} disposed passes"
  transport: "round {round}: {failed} of {units} passes failed for transport after re-runs, above the share {share:.2f}"
  halt: "run halts after round {round}: {reason}"
