<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A loan calculator with a payment table</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#1c1a14;color:#f4f4f6;
padding:14px;min-height:100vh}h1{font-size:18px;margin:0 0 10px}button{font:inherit;padding:6px 12px;
border-radius:6px;border:0;background:#a3e635;color:#111;cursor:pointer}input,select{font:inherit;padding:5px;
border-radius:6px;border:1px solid #555;background:#222;color:#eee}#how-to{margin-top:12px;font-size:12px;
color:#bbb;border-top:1px solid #444;padding-top:8px}table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid #444;padding:4px 6px;text-align:left}
</style></head><body>
<h1>A loan calculator with a payment table</h1>
<p><label>Bill <input id="bill" type="number" value="48"></label></p>
<p><label>Tip <select id="tip"><option>10</option><option selected>15</option><option>20</option></select>
%</label></p>
<p><label>People <input id="people" type="number" value="2" min="1"></label></p>
<p style="font-size:22px">Each pays: <span id="each"></span></p>
<script>
function calc(){const b=+document.getElementById('bill').value||0,t=+document.getElementById('tip').value,
p=Math.max(1,+document.getElementById('people').value||1);
document.getElementById('each').textContent=(b*(1+t/100)/p).toFixed(2);}
for(const id of ['bill','tip','people'])document.getElementById(id).addEventListener('input',calc);calc();
</script>
<section id="how-to"><b>How to use:</b> A tip splitter: the bill, the tip share and the head count give each person&#x27;s share.</section><script type="application/json" id="how-to-data">{"summary": "A tip splitter: the bill, the tip share and the head count give each person's share.", "controls": [{"control": "#bill", "action": "type", "effect": "the share updates"}, {"control": "#tip", "action": "select", "effect": "the share updates"}]}</script></body></html>
