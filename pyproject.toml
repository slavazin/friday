[project]
name = "friday"
version = "0.1.0"
description = "A self-improving builder team with a journal it can account for."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
friday = "friday.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a Crusoe key and network; deselected by default",
    "slow: simulation tests over thousands of runs",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["friday"]
