# Friday run spec: every constant, pin and seed (the one home).
# SPEC.md quotes defaults as pointers to this file; on any disagreement this file holds.
# Frozen before round 1. Changing any value after round 1 starts a new run.

run:
  seed: 20261017
  rounds: 7                    # fitted to the 17:00 deadline from the pilot round (docs/spec-findings.md)
  spend_cap_usd: 30.0
  max_parallel_passes: 32      # every pass of a round starts at once; the round takes about its slowest pass
  convergence_rounds: 3        # halt: quiet rounds after the drift round (SPEC § 11)
  transport_reruns: 1          # a pass failed for transport is re-run at most this many times
  ping_transport_share: 0.3333 # ping when more than this share of a round's passes failed after re-runs
  pass_timeout_s: 600          # a pass process past this is terminated and recorded timed out

pilot:                         # the worker pin rule (SPEC § 5), read once
  min_share_passing: 0.3       # fewer pilot artifacts passing >= 1 acceptance check -> worker takes its fallback
  max_mean_a: 0.85             # pilot mean A above this -> record the headroom premise as falsified

stream:                        # the goal stream and the held-out set (SPEC § 4)
  path: goals/stream.json
  held_out_path: goals/held_out.json
  tags_path: goals/tags.json
  per_round: 10
  held_out: 6
  tags_per_request: [2, 4]
  max_new_tags: 4              # tags the tagger may mint in one round
  checks_per_regime: [2, 3]
  check_regenerations: 1
  families: [canvas game, data tool, timer or tracker, form or calculator, text tool]
  modes: [click or tap, keyboard-driven, drag or pointer, typing, real-time]   # drawn evenly
  held_out_cells: 6            # withheld (family, mode) cells; the held-out set is one request per cell
  split_max_draws: 1000
  mix:                         # share of each family per regime, in `families` order; each sums to 1
    R1: [0.5, 0.15, 0.15, 0.1, 0.1]
    R2: [0.15, 0.5, 0.15, 0.1, 0.1]

drift:
  round: 4
  constraint: >-
    It must work on a phone screen: at 375 px wide every control is visible and usable
    without horizontal scrolling, and touch or click operates it.

worker:
  repair_turns: 1
  max_artifact_bytes: 30720

eval:
  w_a: 0.75
  w_r: 0.25
  a_weights: {probe: 0.3, how_to: 0.3, checks: 0.4}   # A = weighted mean of P, H, C; sums to 1
  viewports:                   # per regime; every reading runs at each and is averaged
    R1: [[1280, 800]]
    R2: [[1280, 800], [375, 812]]
  load_timeout_ms: 15000       # page load / navigation
  action_timeout_ms: 2000      # one click, type or focus
  max_wait_ms: 3000
  rubric_scale: [1, 5]
  rubric_questions: 3          # per viewport
  test_query: "?test=1"
  eslint_config: config/eslint.json

probe:
  max_controls: 12
  settle_ms: 500
  sample_text: "abc 123"

how_to:
  max_controls: 12
  repair_penalty: 0.1          # H is multiplied by (1 - penalty) at repair rungs 2 and 3

composition:
  cap: 6
  rank_by: e_value             # over the cap, the lowest-ranked admitted decisions are left out

gate:
  alpha: 0.3                   # W >= 3.33 admits; see SPEC § 8 resolving power
  n_min: 4
  n_max: 12
  in_flight: 2
  quality_margin: 2.0
  quality_level: 0.90
  betting:
    name: agrapa                # registry key; see friday/stats/eprocess.py
    params:                     # passed to the named strategy as-is
      lambda_first: 0.25
      lambda_max: 0.9
      eps: 1.0e-9
  upper_bound: student_t        # registry key; see friday/stats/bounds.py

detect:
  ablate_p: 0.75
  window: 4
  level: 0.80
  confirm_pairs: 3
  contradicted_share: 0.5

pool:
  expiry_rounds: 6
  recurrence_min_observations: 3
  recurrence_min_rounds: 2
  recurrence_min_requests: 2   # bar counts distinct requests, not passes (a pair's two passes share one)
  fast_track_share: 0.666      # at least 2/3 of the distinct requests (0.6667 would refuse exactly 2/3)
  fast_track_min_requests: 3
  max_direction_labels: 2

lens:
  window: 64
  n_min: 32
  flag_p: 0.5
  value: auc                    # registry key; see friday/stats/ranks.py
  floor_quantile: 0.95
  floor_shuffles: 200
  floor_strikes: 2
  fold_correlation: spearman    # registry key
  fold_rho: 0.85
  mint_every: 2
  residual_loss: 0.5
  residual_min_passes: 6
  mint_max: 2
  cap: 10

judge:
  max_observations: 3
  quote_reasks: 1

nominator:
  payload_max_words: 60
  reasks: 1

notes:
  max_tokens: 8000
  chars_per_token: 4           # the notes budget's token proxy: ceil(characters / chars_per_token)

readout:
  reps: 4
  regime: R2
  r1_p: 0.1                     # R1 improves at p <= r1_p; must equal 1 - interval_level
  r2_margin: 0.05               # R2 earned when its lower bound lies above -r2_margin (non-inferiority, loss units)
  interval_level: 0.90          # one-sided lower bound by inverting `test` (SPEC § 12)
  test: sign_flip_exact         # registry key

transport:
  max_tries: 5
  backoff_base_s: 1.0
  backoff_cap_s: 30.0
  retry_status: [429, 500, 502, 503, 504, 520, 522, 524]   # 52x: the proxy in front of the endpoint timed out
  request_timeout_s: 150      # total per attempt (connect to last byte), enforced by a deadline thread

json:
  reasks: 1

telemetry:                     # operational record only; no decision reads it (friday/ports/telemetry.py)
  busy_timeout_ms: 10000       # SQLite wait for a concurrent writer before raising
  live_poll_ms: 1000           # how often a live view re-reads the log

critic:                        # the critic run only (SPEC § 17); run-critic.yml overrides
  max_requests: 2
  spend_cap_usd: 10.0
  max_parallel_passes: 6       # pass slots the critic run takes while it overlaps the main run

models:
  endpoint:
    base_url: https://managed-inference-api-proxy.crusoecloud.com/v1
    api_key_env: crusoe_key
  # USD per million tokens. Empty: the client reads `pricing` from GET /v1/models.
  price_overrides: {}
  slow_first_call_s: 60         # a drafting-role first call slower than this moves those roles to their fallback
  roles:
    worker:
      pins: [nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B]
      fallback: openai/gpt-oss-120b
      temperature: 0.7
      seed: null
    rubric:
      pins: [nvidia/NVIDIA-Nemotron-3.5-Super-VL, google/gemma-4-31b-it, zai-org/GLM-5.3-Flash, Qwen/Qwen3.8-27B]
      fallback: nvidia/Nemotron-3-Nano-Omni-Reasoning-30B-A3B
      temperature: 0.0
      requires_image: true
    judge:
      pins: [nvidia/NVIDIA-Nemotron-3-Super-120B-A12B]
      fallback: deepseek-ai/DeepSeek-V4-Pro
      temperature: 0.0
    nominator: &drafting        # a different model from the judge, so the roles stay independent
      pins: [zai-org/GLM-5.3]
      fallback: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B
      temperature: 0.3
      slow_first_call_group: drafting
    lens_minter: *drafting
    goal_minter: *drafting
    tagger: *drafting
    pooling: *drafting
    coordinator:
      pins: [openai/gpt-oss-120b]
      fallback: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B
      temperature: 0.2
    critic:                     # reads the screenshot; differs from the rubric, the judge and the nominator (SPEC § 17)
      pins: [nvidia/Nemotron-3-Nano-Omni-Reasoning-30B-A3B]
      fallback: google/gemma-4-31b-it
      temperature: 0.3
      requires_image: true

search:
  provider: youcom
  api_key_env: you_key
  results: 5

paths:
  db: friday.db
  artifacts: artifacts
  journal: journal
  lenses: lenses
  plans: plans
  prompts: prompts
  templates: templates
